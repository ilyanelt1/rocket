<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — CheckStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;display:grid;place-items:center;background:#f5f7fb}.card{width:min(100% - 2rem,420px);border:0;box-shadow:0 3px 20px #172b4d12}</style>
</head>
<body>
  <main class="card p-4">
    <h1 class="h3 mb-1">📦 CheckStock</h1>
    <p class="text-secondary mb-4">Войдите в систему управления складом</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label for="username" class="form-label">Логин</label>
        <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
