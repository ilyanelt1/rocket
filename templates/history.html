<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheckStock — история операций</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
body{background:#f5f7fb}.navbar{background:#14213d}.card{border:0;box-shadow:0 3px 14px #172b4d0d}.table{vertical-align:middle}.muted{color:#748094}
</style>
</head>
<body>
<nav class="navbar navbar-dark mb-4"><div class="container"><a class="navbar-brand fw-bold text-decoration-none" href="/">📦 CheckStock</a><div class="d-flex align-items-center gap-3"><span class="text-white-50">{{ user.username }} · {{ user.role }}</span><a class="btn btn-sm btn-outline-light" href="/">К остаткам</a><form method="post" action="/logout"><button class="btn btn-sm btn-outline-light">Выйти</button></form></div></div></nav>
<main class="container pb-5">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h3 class="mb-1">История операций</h3><div class="muted">Всего найдено: {{ total }}</div></div><a href="/" class="btn btn-outline-secondary">На главную</a></div>
<form id="history-filters" method="get" action="/history" class="card p-3 mb-3">
<div class="row g-3">
<div class="col-lg-4 col-md-6"><label class="form-label">Поиск по SKU, названию или примечанию</label><input name="q" value="{{ filters.q }}" class="form-control" placeholder="Например, SKU-101"></div>
<div class="col-lg-4 col-md-6"><label class="form-label">Товар</label><select name="product_id" class="form-select"><option value="">Все товары</option>{% for p in products %}<option value="{{p.id}}" {% if filters.product_id == p.id %}selected{% endif %}>{{p.sku}} — {{p.name}}</option>{% endfor %}</select></div>
<div class="col-lg-4 col-md-6"><label class="form-label">Тип операции</label><select name="operation_type" class="form-select"><option value="">Все типы</option>{% for kind in operation_types %}<option value="{{kind}}" {% if filters.operation_type == kind %}selected{% endif %}>{{kind}}</option>{% endfor %}</select></div>
<div class="col-lg-3 col-md-6"><label class="form-label">Статус</label><select name="status" class="form-select"><option value="">Все статусы</option>{% for item in statuses %}<option value="{{item}}" {% if filters.status == item %}selected{% endif %}>{{item}}</option>{% endfor %}</select></div>
<div class="col-lg-3 col-md-6"><label class="form-label">Склад</label><select name="warehouse_id" class="form-select"><option value="">Все склады</option>{% for w in warehouses %}<option value="{{w.id}}" {% if filters.warehouse_id == w.id %}selected{% endif %}>{{w.name}}{% if w.deleted_at %} (архив){% endif %}</option>{% endfor %}</select></div>
<div class="col-lg-3 col-md-6"><label class="form-label">Дата с</label><input type="date" name="date_from" value="{{filters.date_from}}" class="form-control"></div>
<div class="col-lg-3 col-md-6"><label class="form-label">Дата по</label><input type="date" name="date_to" value="{{filters.date_to}}" class="form-control"></div>
<div class="col-12 d-flex flex-wrap gap-2"><button class="btn btn-primary" type="button" hx-get="/history" hx-include="#history-filters" hx-target="#history-results" hx-push-url="true">Применить фильтры</button><button class="btn btn-outline-success" type="submit" formaction="/history/export" formmethod="get">Экспорт CSV</button><a href="/history" class="btn btn-outline-secondary">Сбросить</a></div>
</div>
</form>
{% include "history_results.html" %}
</main>
</body>
</html>
