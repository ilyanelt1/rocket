<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Операция не выполнена — CheckStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f5f7fb}.card{border:0;box-shadow:0 3px 14px #172b4d0d}</style>
</head>
<body>
  <main class="container py-5" style="max-width:720px">
    <div class="card p-4">
      <h1 class="h4 mb-3">Операция не выполнена</h1>
      <div class="alert alert-danger" role="alert">{{ error }}</div>
      <p class="text-secondary">Остатки не изменены. Проверь количество и выбранный склад, затем повтори операцию.</p>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary" href="/">Вернуться к остаткам</a>
        <a class="btn btn-outline-secondary" href="/history">Открыть историю</a>
      </div>
    </div>
  </main>
</body>
</html>
