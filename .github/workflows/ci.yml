name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Pre-commit, lint and unit tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: checkstock_test
          POSTGRES_USER: checkstock
          POSTGRES_PASSWORD: checkstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkstock -d checkstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://checkstock:checkstock@localhost:5432/checkstock_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Check Python syntax
        run: python -m compileall -q app migrations tests scripts

      - name: Run unit tests
        run: python -m pytest -q

  smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    needs: lint-and-test
    env:
      SESSION_SECRET: ci-session-secret-not-used-outside-tests-123456
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-123456
      POSTGRES_PASSWORD: ci-postgres-password-123456
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start application stack
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Run HTTP smoke tests
        run: python scripts/smoke.py

      - name: Create PostgreSQL backup
        run: python scripts/db_backup.py backup --output "$RUNNER_TEMP/checkstock-ci.dump"

      - name: Verify backup by restoring into a temporary database
        run: python scripts/db_backup.py verify "$RUNNER_TEMP/checkstock-ci.dump"

      - name: Stop web before restoring the disposable CI database
        run: docker compose stop web

      - name: Restore verified backup into the disposable CI database
        run: python scripts/db_backup.py restore "$RUNNER_TEMP/checkstock-ci.dump" --yes

      - name: Restart web after restore
        run: docker compose up -d --wait web

      - name: Re-run HTTP smoke tests after restore
        run: python scripts/smoke.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v
